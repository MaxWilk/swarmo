[package]
name = "swarmo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Swarmo — API workbench and load-testing desktop app"
publish = false

[lib]
name = "swarmo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
swarmo-core.workspace = true
swarmo-http.workspace = true
swarmo-script.workspace = true
swarmo-load.workspace = true
swarmo-grpc.workspace = true
swarmo-ws.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true
echo-server = { path = "../../echo-server" }
