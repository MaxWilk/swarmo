# Runs everything `npm run ci` runs: rustfmt, clippy with warnings denied, the
# Rust tests, the TypeScript typecheck, the UI tests and the UI build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Windows is where the suite is developed and known to pass; some tests
    # exercise platform-specific paths (cmd.exe quoting for auth commands).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Run the CI script
        run: node tools/ci.mjs
